; PlatformIO project for lightbar2mqtt on an ESP32-C3 Pro Mini.
; Upstream ships an Arduino IDE sketch with no build config at all and no
; release binaries, so this file is ours; nothing here came from the project.

; Upstream is an Arduino IDE sketch with everything in the repository root, and
; this fork keeps that layout so diffs against upstream stay readable.
[platformio]
src_dir = .

[env:esp32-c3-pro-mini]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; generic C3, 4 MB flash — matches this board
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; This project requires C++17. `static constexpr byte preamble[8]` in radio.h is
; declared in-class with no out-of-line definition, which only links because
; C++17 makes static constexpr members implicitly inline. PlatformIO's
; espressif32 platform still defaults to gnu++11, where that is an ODR-use with
; no definition -> "undefined reference to Radio::preamble" at link time.
; Upstream never hits this because arduino-esp32 3.x (Arduino IDE) compiles at
; gnu++2a. Fixing the standard is correct; patching their header would not be.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; The C3 has no USB-UART bridge chip: the USB-C port is wired straight to
    ; the chip's built-in USB Serial/JTAG. Without these two, Serial.print()
    ; goes to GPIO20/21 and the monitor stays blank — which matters here,
    ; because reading the remote's serial off the monitor is a required setup
    ; step, not a debugging convenience.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; Versions pinned to exactly what upstream's README specifies.
    arduino-libraries/Arduino_JSON @ 0.2.0
    robtillaart/CRC               @ 1.0.3
    knolleary/PubSubClient        @ 2.8
    nrf24/RF24                    @ 1.4.10
    ; Environment sensors added to this fork (upstream has no sensor support).
    adafruit/Adafruit BME280 Library @ ^2.2.4
    sensirion/Sensirion I2C SCD4x    @ ^0.4.0

; Throwaway env: same firmware with the nRF24 init skipped, so WiFi and MQTT can
; be proven on a bare board before any soldering. Never flash this for real use
; — it cannot talk to the light bar.
[env:wifitest]
extends     = env:esp32-c3-pro-mini
build_flags = ${env:esp32-c3-pro-mini.build_flags} -DWIFI_TEST_NO_RADIO

; Same firmware, pushed over WiFi instead of USB. Exists as a separate env so
; the USB path stays available unchanged -- OTA is the convenience, USB is the
; recovery. upload_port is the device IP; the mDNS name works too once the
; device has announced itself, but the IP never depends on that.
;
; upload_port is left as a placeholder on purpose -- unlike OTA_PASSWORD (read
; from the environment below), a device IP is not a secret, but it is still
; specific to one LAN and has no business being hardcoded in a file this fork
; ships to other people. Replace it with your device's actual IP, or override
; per-invocation:  pio run -e esp32-c3-pro-mini-ota -t upload --upload-port <ip>
[env:esp32-c3-pro-mini-ota]
extends         = env:esp32-c3-pro-mini
upload_protocol = espota
upload_port     = <device-ip>
; Read from the environment, never written here: platformio.ini is tracked by
; git while config.h is not, and this image contains the WiFi PSK and the MQTT
; password. Set it once with:
;   setx LIGHTBAR_OTA_PASSWORD "<same value as OTA_PASSWORD in config.h>"
upload_flags    =
    --auth=${sysenv.LIGHTBAR_OTA_PASSWORD}
    ; espota does not just push: it makes the device open a TCP connection back
    ; to this machine. Windows Firewall blocks that on a random ephemeral port,
    ; so the host port is pinned here and allowed once with (replace <device-ip>
    ; with the same address as upload_port above):
    ;   New-NetFirewallRule -DisplayName "lightbar2mqtt OTA (espota) TCP 3233" `
    ;     -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3233 -RemoteAddress <device-ip>
    --host_port=3233
